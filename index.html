<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Han Burger Calendar</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e0c0a;
        --panel: rgba(18, 15, 13, 0.97);
        --panel-2: rgba(24, 20, 17, 0.9);
        --panel-3: rgba(255, 248, 240, 0.06);
        --field-bg: rgba(9, 8, 7, 0.82);
        --cell-bg: rgba(13, 11, 10, 0.86);
        --outside-bg: rgba(8, 7, 6, 0.88);
        --border: rgba(255, 255, 255, 0.08);
        --border-strong: rgba(255, 255, 255, 0.16);
        --text: #f6efe5;
        --muted: #bca998;
        --faint: #89796b;
        --accent: #e1a84b;
        --accent-2: #efbf68;
        --amber: #efbf68;
        --red: #d85d52;
        --shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      }

      html[data-theme="light"] {
        color-scheme: light;
        --bg: #efe7d8;
        --panel: rgba(247, 242, 234, 0.96);
        --panel-2: rgba(255, 251, 245, 0.92);
        --panel-3: rgba(38, 31, 23, 0.05);
        --field-bg: rgba(255, 251, 245, 0.88);
        --cell-bg: rgba(255, 251, 245, 0.72);
        --outside-bg: rgba(238, 229, 216, 0.68);
        --border: rgba(72, 58, 37, 0.12);
        --border-strong: rgba(72, 58, 37, 0.2);
        --text: #261f17;
        --muted: #75695a;
        --faint: #9a8d7c;
        --accent: #b56a35;
        --accent-2: #cf8b4f;
        --amber: #b56a35;
        --red: #c95c4f;
        --shadow: 0 24px 60px rgba(78, 59, 38, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        min-height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", "Microsoft JhengHei UI", "Noto Sans TC",
          sans-serif;
      }

      html {
        overflow-y: auto;
        scrollbar-gutter: stable;
      }

      body {
        overflow-x: hidden;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .app-shell {
        display: grid;
        height: 100vh;
        overflow: hidden;
      }

      .agenda-panel,
      .calendar-panel {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .event-form {
        display: grid;
        gap: 10px;
        padding: 14px;
        border-top: 1px solid var(--border);
        background: var(--field-bg);
      }

      .event-form[hidden],
      .add-event-button[hidden] {
        display: none;
      }

      .event-form h2,
      .agenda-panel h2 {
        margin: 0;
        font-size: 15px;
      }

      label,
      .field {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
      }

      input,
      textarea,
      select {
        width: 100%;
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--field-bg);
        color: var(--text);
        padding: 10px 11px;
        outline: none;
      }

      textarea {
        min-height: 74px;
        resize: vertical;
      }

      input:focus,
      textarea:focus,
      select:focus {
        border-color: color-mix(in srgb, var(--amber) 72%, transparent);
      }

      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .color-options {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .color-option {
        display: grid;
        width: 32px;
        height: 32px;
        place-items: center;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel-2);
      }

      .color-option input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .color-option span {
        width: 18px;
        height: 18px;
        border-radius: 999px;
        background: var(--swatch);
      }

      .color-option:has(input:checked) {
        border-color: var(--swatch);
        box-shadow: inset 0 0 0 1px var(--swatch);
      }

      .primary-button {
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: var(--bg);
        padding: 11px 12px;
        font-weight: 800;
      }

      .secondary-button {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel-2);
        color: var(--text);
        padding: 10px 12px;
      }

      .add-event-button {
        margin: 14px;
      }

      .form-actions {
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.8fr);
        gap: 8px;
      }

      .form-actions .primary-button {
        min-height: 46px;
        font-size: 15px;
      }

      .form-actions .primary-button:not(:has(+ .secondary-button:not([hidden]))) {
        grid-column: 1 / -1;
      }

      main {
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 18px;
        min-width: 0;
        min-height: 0;
        padding: 22px;
        overflow: hidden;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-width: 0;
      }

      .date-heading {
        min-width: 0;
      }

      .date-heading p {
        margin: 0 0 4px;
        color: var(--muted);
        font-size: 13px;
      }

      .date-heading h2 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 0;
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .icon-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 42px;
        min-height: 40px;
        padding: 8px 10px;
      }

      .icon-button svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }

      .content-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 360px;
        gap: 18px;
        min-height: 0;
        align-items: stretch;
      }

      .calendar-panel {
        min-width: 0;
        overflow: hidden;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .calendar-header {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        border-bottom: 1px solid var(--border);
        background: var(--panel-2);
      }

      .calendar-header div {
        padding: 12px 10px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-align: center;
      }

      .calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        grid-template-rows: repeat(4, minmax(0, 1fr));
        min-height: 0;
      }

      .day-cell {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-start;
        min-width: 0;
        min-height: 0;
        border-right: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
        border-top: 0;
        border-left: 0;
        background: var(--cell-bg);
        color: inherit;
        padding: 10px;
        text-align: left;
        appearance: none;
      }

      .day-cell:nth-child(7n) {
        border-right: 0;
      }

      .day-cell.outside {
        background: var(--outside-bg);
        color: var(--faint);
      }

      .day-cell.is-selected {
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--amber) 72%, transparent);
      }

      .day-number {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 6px;
        margin-bottom: 8px;
        font-size: 13px;
        font-weight: 800;
      }

      .today-tag {
        border: 1px solid rgba(255, 209, 102, 0.56);
        border-radius: 999px;
        color: var(--amber);
        padding: 1px 6px 2px;
        font-size: 11px;
        font-weight: 800;
        line-height: 1.25;
      }

      .event-stack {
        display: grid;
        gap: 5px;
        width: 100%;
        min-width: 0;
      }

      .event-pill {
        overflow: hidden;
        border: 1px solid var(--event-border, rgba(122, 167, 255, 0.24));
        border-left: 3px solid var(--event-color, var(--accent-2));
        border-radius: 6px;
        background: var(--event-bg, rgba(122, 167, 255, 0.1));
        color: var(--text);
        padding: 5px 7px;
        text-align: left;
        white-space: nowrap;
        text-overflow: ellipsis;
        font-size: 12px;
      }

      .event-pill.done {
        color: var(--faint);
        text-decoration: line-through;
      }

      .color-dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: var(--event-color, var(--accent-2));
      }

      .agenda-panel {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        min-width: 0;
        overflow: hidden;
      }

      .agenda-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 14px;
        border-bottom: 1px solid var(--border);
        background: var(--panel-2);
      }

      .agenda-list {
        display: grid;
        align-content: start;
        gap: 10px;
        overflow: auto;
        scrollbar-gutter: stable;
        padding: 14px;
      }

      .agenda-item {
        display: grid;
        gap: 6px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--cell-bg);
        padding: 12px;
      }

      .agenda-item.done {
        border-color: rgba(85, 199, 166, 0.28);
        background: rgba(85, 199, 166, 0.06);
      }

      .agenda-item.done h3 {
        color: var(--faint);
        text-decoration: line-through;
      }

      .agenda-item header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
      }

      .agenda-item h3 {
        margin: 0;
        font-size: 15px;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      .agenda-item time,
      .agenda-item p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .agenda-item p {
        margin-top: 4px;
      }

      .item-actions {
        display: flex;
        gap: 6px;
        flex-shrink: 0;
      }

      .agenda-actions-column {
        display: grid;
        justify-items: end;
        gap: 8px;
        flex-shrink: 0;
      }

      .complete-button {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        width: fit-content;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--panel-2);
        color: var(--muted);
        padding: 6px 10px;
        font-size: 12px;
        font-weight: 800;
      }

      .complete-button.done {
        border-color: rgba(85, 199, 166, 0.55);
        color: var(--accent);
        background: rgba(85, 199, 166, 0.1);
      }

      .small-button {
        display: grid;
        width: 30px;
        height: 30px;
        place-items: center;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--panel-2);
        color: var(--text);
      }

      .empty-state {
        display: grid;
        place-items: center;
        min-height: 220px;
        border: 1px dashed var(--border);
        border-radius: 8px;
        color: var(--faint);
        text-align: center;
        padding: 22px;
      }

      .toast {
        position: fixed;
        left: 50%;
        top: 18px;
        max-width: min(360px, calc(100vw - 36px));
        border: 1px solid var(--border-strong);
        border-radius: 8px;
        background: var(--panel-2);
        box-shadow: var(--shadow);
        color: var(--text);
        padding: 12px 14px;
        transform: translate(-50%, -18px);
        opacity: 0;
        pointer-events: none;
        transition: 0.18s ease;
      }

      .toast.show {
        transform: translate(-50%, 0);
        opacity: 1;
      }

      .sync-overlay {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: grid;
        place-items: center;
        padding: 24px;
        background: color-mix(in srgb, var(--bg) 72%, transparent);
        backdrop-filter: blur(8px);
      }

      .sync-overlay.hidden {
        display: none;
      }

      .sync-card {
        width: min(360px, calc(100vw - 36px));
        border: 1px solid var(--border-strong);
        border-radius: 8px;
        background: var(--panel-2);
        box-shadow: var(--shadow);
        padding: 18px;
        text-align: center;
      }

      .sync-card strong {
        display: block;
        margin-bottom: 8px;
      }

      .sync-card span {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
      }

      @media (max-width: 980px) {
        .app-shell {
          grid-template-columns: 1fr;
        }

        .content-grid {
          grid-template-columns: 1fr;
          overflow: auto;
        }

        .calendar-grid {
          min-height: 432px;
        }
      }

      @media (max-width: 640px) {
        main {
          padding: 14px;
        }

        .topbar {
          align-items: stretch;
          flex-direction: column;
        }

        .top-actions {
          justify-content: stretch;
        }

        .top-actions > * {
          flex: 1;
        }

        .date-heading h2 {
          font-size: 23px;
        }

        .form-row {
          grid-template-columns: 1fr;
        }

        .calendar-header div {
          padding: 9px 2px;
        }

        .day-cell {
          min-height: 88px;
          padding: 7px;
        }

        .event-pill {
          padding: 4px 5px;
          font-size: 11px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <main>
        <header class="topbar">
          <div class="date-heading">
            <p id="todayLabel"></p>
            <h2 id="mainMonthLabel"></h2>
          </div>
          <div class="top-actions">
            <button class="secondary-button" id="prevMonth" type="button">
              上個月
            </button>
            <button class="secondary-button" id="todayButton" type="button">
              今天
            </button>
            <button class="secondary-button" id="nextMonth" type="button">
              下個月
            </button>
            <button class="secondary-button icon-button" id="uploadButton" type="button" title="上傳" aria-label="上傳">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M17.5 18a4.5 4.5 0 0 0 .5-9 6 6 0 0 0-11.4-1.8A4.8 4.8 0 0 0 7 18" />
                <path d="M12 17V10" />
                <path d="m8.5 13.5 3.5-3.5 3.5 3.5" />
              </svg>
              <span class="sr-only">上傳</span>
            </button>
            <button class="secondary-button icon-button" id="downloadButton" type="button" title="下載" aria-label="下載">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M17.5 18a4.5 4.5 0 0 0 .5-9 6 6 0 0 0-11.4-1.8A4.8 4.8 0 0 0 7 18" />
                <path d="M12 10v7" />
                <path d="m8.5 13.5 3.5 3.5 3.5-3.5" />
              </svg>
              <span class="sr-only">下載</span>
            </button>
            <button class="secondary-button" id="notifyButton" type="button">
              開啟通知
            </button>
          </div>
        </header>

        <section class="content-grid">
          <section class="calendar-panel" aria-label="月份行事曆">
            <div class="calendar-header">
              <div>日</div>
              <div>一</div>
              <div>二</div>
              <div>三</div>
              <div>四</div>
              <div>五</div>
              <div>六</div>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
          </section>

          <section class="agenda-panel" aria-label="當日事件">
            <div class="agenda-head">
              <h2 id="agendaTitle"></h2>
              <span id="agendaCount"></span>
            </div>
            <div class="agenda-list" id="agendaList"></div>
            <button
              class="primary-button add-event-button"
              id="addEventButton"
              type="button"
              hidden
            >
              新增事件
            </button>
            <form class="event-form" id="eventForm">
              <h2 id="formTitle">新增事件</h2>
              <input type="hidden" id="eventId" />
              <label>
                標題
                <input id="titleInput" autocomplete="off" required />
              </label>
              <div class="form-row">
                <label>
                  日期
                  <input id="dateInput" type="date" required />
                </label>
                <label>
                  時間
                  <select id="timeInput">
                    <option value="" selected>整天</option>
                  </select>
                </label>
              </div>
              <div class="field">
                <span>顏色</span>
                <div class="color-options" id="colorOptions">
                  <label class="color-option" style="--swatch: #7aa7ff" title="藍色">
                    <input type="radio" name="eventColor" value="#7aa7ff" checked />
                    <span></span>
                  </label>
                  <label class="color-option" style="--swatch: #55c7a6" title="綠色">
                    <input type="radio" name="eventColor" value="#55c7a6" />
                    <span></span>
                  </label>
                  <label class="color-option" style="--swatch: #ffd166" title="黃色">
                    <input type="radio" name="eventColor" value="#ffd166" />
                    <span></span>
                  </label>
                  <label class="color-option" style="--swatch: #ff7a7a" title="紅色">
                    <input type="radio" name="eventColor" value="#ff7a7a" />
                    <span></span>
                  </label>
                  <label class="color-option" style="--swatch: #b197fc" title="紫色">
                    <input type="radio" name="eventColor" value="#b197fc" />
                    <span></span>
                  </label>
                </div>
              </div>
              <div class="form-row">
                <label>
                  提醒方式
                  <select id="reminderRepeatInput">
                    <option value="once" selected>提醒一次</option>
                    <option value="hourly">每小時提醒</option>
                    <option value="daily">每天提醒</option>
                    <option value="none">不提醒</option>
                  </select>
                </label>
                <label>
                  提醒時間
                  <select id="reminderInput">
                    <option value="0">準時提醒</option>
                    <option value="5">提前 5 分鐘</option>
                    <option value="15" selected>提前 15 分鐘</option>
                    <option value="30">提前 30 分鐘</option>
                    <option value="60">提前 1 小時</option>
                    <option value="120">提前 2 小時</option>
                    <option value="360">提前 6 小時</option>
                    <option value="720">提前 12 小時</option>
                    <option value="1440">提前 1 天</option>
                    <option value="2880">提前 2 天</option>
                    <option value="10080">提前 1 週</option>
                  </select>
                </label>
              </div>
              <label>
                備註
                <textarea id="noteInput"></textarea>
              </label>
              <div class="form-actions">
                <button class="primary-button" type="submit">儲存</button>
                <button class="secondary-button" id="cancelEdit" type="button" hidden>
                  取消
                </button>
              </div>
            </form>
          </section>
        </section>
      </main>
    </div>

    <div class="sync-overlay hidden" id="syncOverlay" role="status" aria-live="polite">
      <div class="sync-card">
        <strong>正在抓取 Calendar 同步資料</strong>
        <span id="syncOverlayMessage">請稍候，資料抓取完成後即可操作。</span>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      const STORAGE_KEY = "han-burger-calendar-events-v1";
      const notifiedIds = new Set();
      const bridgeRequests = new Map();
      const ALL_DAY_REMINDER_HOUR = 9;
      const REPEAT_INTERVALS = {
        hourly: 60 * 60 * 1000,
        daily: 24 * 60 * 60 * 1000,
      };
      const state = {
        cursor: startOfMonth(new Date()),
        selected: toDateKey(new Date()),
        events: loadEvents(),
        formOpen: false,
        hasLocalChanges: false,
        isDesktopSyncLoading: window.parent !== window,
        sync: null,
      };

      function applyDesktopTheme(theme) {
        document.documentElement.dataset.theme = theme === "light" ? "light" : "dark";
      }

      window.addEventListener("message", (event) => {
        const message = event.data || {};
        if (message.source === "han-burger-desktop" && message.type === "theme") {
          applyDesktopTheme(message.theme);
          return;
        }

        if (message.source === "han-burger-desktop-control" && message.type === "calendar:uploadBeforeClose") {
          uploadEvents().finally(() => {
            event.source.postMessage({
              source: "han-burger-calendar-control",
              requestId: message.requestId,
              ok: true
            }, "*");
          });
          return;
        }

        if (message.source !== "han-burger-desktop" || !message.requestId) {
          return;
        }

        const request = bridgeRequests.get(message.requestId);
        if (!request) {
          return;
        }

        bridgeRequests.delete(message.requestId);
        if (message.ok) {
          request.resolve(message.payload);
        } else {
          request.reject(new Error(message.error || "Desktop sync failed."));
        }
      });

      const els = {
        mainMonthLabel: document.querySelector("#mainMonthLabel"),
        todayLabel: document.querySelector("#todayLabel"),
        calendarGrid: document.querySelector("#calendarGrid"),
        agendaTitle: document.querySelector("#agendaTitle"),
        agendaCount: document.querySelector("#agendaCount"),
        agendaList: document.querySelector("#agendaList"),
        addEventButton: document.querySelector("#addEventButton"),
        eventForm: document.querySelector("#eventForm"),
        formTitle: document.querySelector("#formTitle"),
        eventId: document.querySelector("#eventId"),
        titleInput: document.querySelector("#titleInput"),
        dateInput: document.querySelector("#dateInput"),
        timeInput: document.querySelector("#timeInput"),
        colorInputs: document.querySelectorAll('input[name="eventColor"]'),
        reminderRepeatInput: document.querySelector("#reminderRepeatInput"),
        reminderInput: document.querySelector("#reminderInput"),
        noteInput: document.querySelector("#noteInput"),
        cancelEdit: document.querySelector("#cancelEdit"),
        downloadButton: document.querySelector("#downloadButton"),
        uploadButton: document.querySelector("#uploadButton"),
        syncOverlay: document.querySelector("#syncOverlay"),
        syncOverlayMessage: document.querySelector("#syncOverlayMessage"),
        toast: document.querySelector("#toast"),
      };

      document.querySelector("#prevMonth").addEventListener("click", () => {
        shiftMonth(-1);
      });
      document.querySelector("#nextMonth").addEventListener("click", () => {
        shiftMonth(1);
      });
      document.querySelector("#todayButton").addEventListener("click", () => {
        const today = new Date();
        state.cursor = startOfMonth(today);
        state.selected = toDateKey(today);
        state.formOpen = false;
        resetFormDate();
        render();
      });
      document.querySelector("#notifyButton").addEventListener("click", async () => {
        if (!("Notification" in window)) {
          showToast("這個環境不支援系統通知。");
          return;
        }
        const permission = await Notification.requestPermission();
        showToast(permission === "granted" ? "通知已開啟。" : "尚未允許通知。");
      });

      els.downloadButton.addEventListener("click", async () => {
        await downloadEvents();
      });

      els.uploadButton.addEventListener("click", async () => {
        await uploadEvents();
      });

      els.reminderRepeatInput.addEventListener("change", () => {
        applyReminderRepeat(els.reminderRepeatInput.value);
      });

      els.eventForm.addEventListener("submit", (event) => {
        event.preventDefault();
        try {
          const title = els.titleInput.value.trim();
          if (!title) return;

          const existingId = els.eventId.value;
          const existingEvent = state.events.find((item) => item.id === existingId);
          const now = new Date().toISOString();
          const record = {
            id: existingId || createId(),
            title,
            date: els.dateInput.value,
            time: els.timeInput.value,
            color: selectedColor(),
            reminderMinutes: Number(els.reminderInput.value),
            reminderRepeat: els.reminderRepeatInput.value,
            note: els.noteInput.value.trim(),
            done: existingId
              ? Boolean(existingEvent?.done)
              : false,
            createdAt: existingId
              ? existingEvent?.createdAt
              : now,
            updatedAt: now,
            deletedAt: null,
          };

          state.events = existingId
            ? state.events.map((item) => (item.id === existingId ? record : item))
            : [...state.events, record];
          state.selected = record.date;
          state.cursor = startOfMonth(parseDateKey(record.date));
          saveEvents();
          clearForm();
          state.formOpen = false;
          render();
          showToast(existingId ? "已更新事件。" : "已新增事件。");
        } catch (error) {
          showToast(`新增事件失敗：${error.message}`);
        }
      });

      els.cancelEdit.addEventListener("click", () => {
        clearForm();
        state.formOpen = false;
        renderAgenda();
      });

      els.addEventButton.addEventListener("click", () => {
        clearForm();
        state.formOpen = true;
        renderAgenda();
        els.titleInput.focus();
      });

      function render() {
        const today = new Date();
        els.todayLabel.textContent = `今天 ${formatDateLong(today)}`;
        els.mainMonthLabel.textContent = formatMonth(state.cursor);
        renderSyncOverlay();
        renderMonthGrid();
        renderAgenda();
      }

      function renderSyncOverlay() {
        els.syncOverlay.classList.toggle("hidden", !state.isDesktopSyncLoading);
        els.syncOverlayMessage.textContent = state.sync?.message || "請稍候，資料抓取完成後即可操作。";
      }

      function renderMonthGrid() {
        els.calendarGrid.innerHTML = "";
        const todayKey = toDateKey(new Date());

        for (const date of getCalendarDates(parseDateKey(state.selected))) {
          const key = toDateKey(date);
          const dayEvents = eventsForDate(key);
          const cell = document.createElement("button");
          cell.type = "button";
          cell.className = [
            "day-cell",
            date.getMonth() === state.cursor.getMonth() ? "" : "outside",
            key === todayKey ? "is-today" : "",
            key === state.selected ? "is-selected" : "",
          ]
            .filter(Boolean)
            .join(" ");
          cell.addEventListener("click", () => selectDate(date));

          const number = document.createElement("div");
          number.className = "day-number";
          number.innerHTML = `<span>${date.getDate()}</span><span>${
            key === todayKey ? '<span class="today-tag">今天</span>' : ""
          }</span>`;
          cell.append(number);

          const stack = document.createElement("div");
          stack.className = "event-stack";
          dayEvents.slice(0, 3).forEach((item) => {
            const pill = document.createElement("div");
            pill.className = `event-pill ${item.done ? "done" : ""}`;
            applyEventColor(pill, item.color);
            pill.textContent = item.title;
            stack.append(pill);
          });
          if (dayEvents.length > 3) {
            const more = document.createElement("div");
            more.className = "event-pill";
            more.textContent = `還有 ${dayEvents.length - 3} 項`;
            stack.append(more);
          }
          cell.append(stack);
          els.calendarGrid.append(cell);
        }
      }

      function renderAgenda() {
        const selectedDate = parseDateKey(state.selected);
        const events = eventsForDate(state.selected);
        els.agendaTitle.textContent = formatDateLong(selectedDate);
        els.agendaCount.textContent = `${events.length} 項`;
        els.agendaList.innerHTML = "";
        updateFormVisibility(events.length);

        if (!events.length) {
          els.agendaList.innerHTML =
            '<div class="empty-state">這天沒有事件。</div>';
          return;
        }

        for (const item of events) {
          const article = document.createElement("article");
          article.className = `agenda-item ${item.done ? "done" : ""}`;
          applyEventColor(article, item.color);
          article.innerHTML = `
            <header>
              <div>
                <h3>${escapeHtml(item.title)}</h3>
                <time><span class="color-dot"></span> ${eventMetaLabel(item)}</time>
                ${item.note ? `<p>${escapeHtml(item.note)}</p>` : ""}
              </div>
              <div class="agenda-actions-column">
                <div class="item-actions">
                  <button class="small-button" type="button" title="編輯" data-edit="${item.id}">✎</button>
                  <button class="small-button" type="button" title="刪除" data-delete="${item.id}">×</button>
                </div>
                <button class="complete-button ${item.done ? "done" : ""}" type="button" data-toggle-done="${item.id}">
                  ${item.done ? "已完成" : "標示完成"}
                </button>
              </div>
            </header>
          `;
          els.agendaList.append(article);
        }

        els.agendaList.querySelectorAll("[data-toggle-done]").forEach((button) => {
          button.addEventListener("click", () => toggleDone(button.dataset.toggleDone));
        });
        els.agendaList.querySelectorAll("[data-edit]").forEach((button) => {
          button.addEventListener("click", () => editEvent(button.dataset.edit));
        });
        els.agendaList.querySelectorAll("[data-delete]").forEach((button) => {
          button.addEventListener("click", () => deleteEvent(button.dataset.delete));
        });
      }

      function updateFormVisibility(eventCount) {
        const isEditing = Boolean(els.eventId.value);
        const shouldShowForm = eventCount === 0 || state.formOpen || isEditing;
        els.eventForm.hidden = !shouldShowForm;
        els.addEventButton.hidden = shouldShowForm;
        els.cancelEdit.hidden = !(state.formOpen || isEditing);
      }

      function shiftMonth(amount) {
        const selected = parseDateKey(state.selected);
        const targetYear = selected.getFullYear();
        const targetMonth = selected.getMonth() + amount;
        const targetDay = selected.getDate();
        const maxDay = new Date(targetYear, targetMonth + 1, 0).getDate();
        const shifted = new Date(
          targetYear,
          targetMonth,
          Math.min(targetDay, maxDay)
        );
        state.selected = toDateKey(shifted);
        state.cursor = startOfMonth(shifted);
        state.formOpen = false;
        resetFormDate();
        render();
      }

      function selectDate(date) {
        state.selected = toDateKey(date);
        state.cursor = startOfMonth(date);
        state.formOpen = false;
        resetFormDate();
        render();
      }

      function editEvent(id) {
        const item = state.events.find((event) => event.id === id);
        if (!item) return;
        state.formOpen = true;
        els.eventForm.hidden = false;
        els.addEventButton.hidden = true;
        els.formTitle.textContent = "編輯事件";
        els.eventId.value = item.id;
        els.titleInput.value = item.title;
        els.dateInput.value = item.date;
        els.timeInput.value = item.time || "";
        setSelectedColor(item.color || "#7aa7ff");
        els.reminderRepeatInput.value = getReminderRepeat(item);
        applyReminderRepeat(els.reminderRepeatInput.value);
        els.reminderInput.value = String(getReminderMinutes(item));
        els.noteInput.value = item.note || "";
        els.cancelEdit.hidden = false;
        els.titleInput.focus();
      }

      function deleteEvent(id) {
        const now = new Date().toISOString();
        state.events = state.events.map((item) =>
          item.id === id ? { ...item, updatedAt: now, deletedAt: now } : item
        );
        saveEvents();
        clearForm();
        render();
        showToast("已刪除事件。");
      }

      function toggleDone(id) {
        let isDone = false;
        state.events = state.events.map((item) => {
          if (item.id !== id) return item;
          isDone = !item.done;
          return { ...item, done: isDone, updatedAt: new Date().toISOString() };
        });
        saveEvents();
        render();
        showToast(isDone ? "已標示完成。" : "已取消完成。");
      }

      function clearForm() {
        els.formTitle.textContent = "新增事件";
        els.eventId.value = "";
        els.titleInput.value = "";
        els.timeInput.value = "";
        setSelectedColor("#7aa7ff");
        els.reminderRepeatInput.value = "once";
        els.reminderInput.value = "15";
        applyReminderRepeat("once");
        els.noteInput.value = "";
        els.cancelEdit.hidden = true;
        resetFormDate();
      }

      function resetFormDate() {
        els.dateInput.value = state.selected;
        els.timeInput.value = "";
      }

      function eventsForDate(dateKey) {
        return state.events
          .filter((event) => !event.deletedAt && event.date === dateKey)
          .sort((a, b) => eventSortKey(a).localeCompare(eventSortKey(b)));
      }

      function eventSortKey(item) {
        return `${item.done ? "1" : "0"}-${item.time || "00:00"}-${item.createdAt || ""}`;
      }

      function checkReminders() {
        const now = Date.now();
        for (const item of state.events) {
          if (item.done || item.deletedAt)
            continue;

          const reminderKey = getReminderKey(item, now);
          if (reminderKey && !notifiedIds.has(reminderKey)) {
            notifiedIds.add(reminderKey);
            notify(item);
          }
        }
      }

      function notify(item) {
        const overdueText = Date.now() > getEventDueTime(item) ? "已過期 · " : "";
        const body = `${overdueText}${item.date} ${eventTimeLabel(item)}${item.note ? " · " + item.note : ""}`;
        if ("Notification" in window && Notification.permission === "granted") {
          new Notification(item.title, { body });
        }
        showToast(`${item.title} · ${overdueText}${eventTimeLabel(item)}`);
      }

      function showToast(message) {
        els.toast.textContent = message;
        els.toast.classList.add("show");
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(() => {
          els.toast.classList.remove("show");
        }, 2600);
      }

      function getCalendarDates(anchorDate) {
        const start = new Date(anchorDate);
        start.setDate(anchorDate.getDate() - anchorDate.getDay() - 7);
        return Array.from({ length: 28 }, (_, index) => {
          const date = new Date(start);
          date.setDate(start.getDate() + index);
          return date;
        });
      }

      function loadEvents() {
        try {
          const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
          return Array.isArray(parsed) ? parsed : [];
        } catch {
          return [];
        }
      }

      function saveEvents() {
        state.hasLocalChanges = true;
        saveLocalEvents();
        saveEventsToDesktop();
      }

      function saveLocalEvents() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state.events));
        } catch {
          // Sandboxed desktop iframes may not expose localStorage.
        }
      }

      function requestDesktop(type, payload = {}) {
        if (window.parent === window) {
          return Promise.reject(new Error("Desktop bridge is not available."));
        }

        const requestId = createId();
        const request = new Promise((resolve, reject) => {
          bridgeRequests.set(requestId, { resolve, reject });
          setTimeout(() => {
            if (!bridgeRequests.has(requestId)) return;
            bridgeRequests.delete(requestId);
            reject(new Error("Desktop bridge timed out."));
          }, 5000);
        });

        window.parent.postMessage({
          source: "han-burger-calendar",
          requestId,
          type,
          ...payload
        }, "*");

        return request;
      }

      async function loadEventsFromDesktop() {
        state.isDesktopSyncLoading = window.parent !== window;
        renderSyncOverlay();
        try {
          const payload = await requestDesktop("calendar:getEvents");
          if (Array.isArray(payload?.events)) {
            if (state.hasLocalChanges) {
              return;
            }
            state.events = payload.events;
            saveLocalEvents();
            state.sync = payload.sync || null;
            render();
            if (state.sync?.provider === "google-drive") {
              showToast(state.sync.ok ? "已同步 Google Drive。" : `Google Drive 同步失敗：${state.sync.message}`);
            }
          }
        } catch {
          state.sync = {
            provider: "local",
            ok: true,
            message: "使用本機資料"
          };
        } finally {
          state.isDesktopSyncLoading = false;
          renderSyncOverlay();
        }
      }

      async function saveEventsToDesktop() {
        try {
          const payload = await requestDesktop("calendar:saveEvents", {
            events: state.events
          });
          if (Array.isArray(payload?.events)) {
            state.events = payload.events;
            state.hasLocalChanges = false;
            saveLocalEvents();
            state.sync = payload.sync || null;
            render();
          }
        } catch {
          state.sync = {
            provider: "local",
            ok: true,
            message: "已儲存到本機瀏覽器"
          };
        }
      }

      async function downloadEvents() {
        els.downloadButton.disabled = true;
        showToast("正在下載同步資料...");
        try {
          const payload = await requestDesktop("calendar:downloadEvents");
          if (Array.isArray(payload?.events)) {
            state.events = payload.events;
            state.hasLocalChanges = false;
            saveLocalEvents();
            state.sync = payload.sync || null;
            render();
          }
          showToast(payload?.sync?.ok ? "已下載同步資料。" : `下載失敗：${payload?.sync?.message || "未知錯誤"}`);
        } catch (error) {
          showToast(`下載失敗：${error.message}`);
        } finally {
          els.downloadButton.disabled = false;
        }
      }

      async function uploadEvents() {
        els.uploadButton.disabled = true;
        showToast("正在上傳同步資料...");
        try {
          const payload = await requestDesktop("calendar:uploadEvents", {
            events: state.events
          });
          if (Array.isArray(payload?.events)) {
            state.events = payload.events;
            saveLocalEvents();
            state.sync = payload.sync || null;
            render();
          }
          showToast(payload?.sync?.ok ? "已上傳同步資料。" : `上傳失敗：${payload?.sync?.message || "未知錯誤"}`);
        } catch (error) {
          showToast(`上傳失敗：${error.message}`);
        } finally {
          els.uploadButton.disabled = false;
        }
      }

      function startOfMonth(date) {
        return new Date(date.getFullYear(), date.getMonth(), 1);
      }

      function toDateKey(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function parseDateKey(key) {
        const [year, month, day] = key.split("-").map(Number);
        return new Date(year, month - 1, day);
      }

      function formatMonth(date) {
        return new Intl.DateTimeFormat("zh-Hant-TW", {
          year: "numeric",
          month: "long",
        }).format(date);
      }

      function formatDateLong(date) {
        return new Intl.DateTimeFormat("zh-Hant-TW", {
          year: "numeric",
          month: "long",
          day: "numeric",
          weekday: "short",
        }).format(date);
      }

      function eventTimeLabel(item) {
        return item.time || "整天";
      }

      function eventMetaLabel(item) {
        return `${eventTimeLabel(item)} · ${reminderLabel(item)}`;
      }

      function populateTimeOptions() {
        for (let hour = 0; hour < 24; hour += 1) {
          for (const minute of [0, 30]) {
            const value = `${String(hour).padStart(2, "0")}:${String(minute).padStart(2, "0")}`;
            const option = document.createElement("option");
            option.value = value;
            option.textContent = value;
            els.timeInput.append(option);
          }
        }
      }

      function createId() {
        if (window.crypto?.randomUUID) {
          return window.crypto.randomUUID();
        }

        const randomPart = Math.random().toString(36).slice(2, 10);
        return `event-${Date.now().toString(36)}-${randomPart}`;
      }

      function selectedColor() {
        return (
          Array.from(els.colorInputs).find((input) => input.checked)?.value ||
          "#7aa7ff"
        );
      }

      function setSelectedColor(color) {
        const safeColor = /^#[0-9a-f]{6}$/i.test(color || "")
          ? color
          : "#7aa7ff";
        els.colorInputs.forEach((input) => {
          input.checked = input.value === safeColor;
        });
      }

      function reminderLabel(item) {
        const repeat = getReminderRepeat(item);
        if (repeat === "none") return "不提醒";

        const repeatLabel = {
          once: "提醒一次",
          hourly: "每小時提醒",
          daily: "每天提醒",
        }[repeat] || "提醒一次";

        return `${repeatLabel} · ${reminderTimeLabel(getReminderMinutes(item))}`;
      }

      function reminderTimeLabel(minutes) {
        if (minutes === 0) return "準時";
        if (minutes < 60) return `提前 ${minutes} 分鐘`;
        if (minutes < 1440) return `提前 ${minutes / 60} 小時`;
        if (minutes < 10080) return `提前 ${minutes / 1440} 天`;
        return `提前 ${minutes / 10080} 週`;
      }

      function getReminderRepeat(item) {
        if (item.reminderRepeat) return item.reminderRepeat;
        return Number(item.reminderMinutes) < 0 ? "none" : "once";
      }

      function getReminderMinutes(item) {
        const minutes = Number(item.reminderMinutes);
        return Number.isFinite(minutes) && minutes >= 0 ? minutes : 15;
      }

      function applyReminderRepeat(repeat) {
        const isDisabled = repeat === "none";
        els.reminderInput.disabled = isDisabled;
      }

      function getEventDueTime(item) {
        const time = item.time || `${String(ALL_DAY_REMINDER_HOUR).padStart(2, "0")}:00`;
        return new Date(`${item.date}T${time}:00`).getTime();
      }

      function getReminderKey(item, now) {
        const repeat = getReminderRepeat(item);
        if (repeat === "none") return null;

        const startsAt = getEventDueTime(item) - getReminderMinutes(item) * 60000;
        if (now < startsAt) return null;

        if (repeat === "once") {
          return `${item.id}:once`;
        }

        const interval = REPEAT_INTERVALS[repeat];
        if (!interval) return `${item.id}:once`;

        const occurrence = Math.floor((now - startsAt) / interval);
        return `${item.id}:${repeat}:${occurrence}`;
      }

      function applyEventColor(element, color) {
        const safeColor = /^#[0-9a-f]{6}$/i.test(color || "")
          ? color
          : "#7aa7ff";
        element.style.setProperty("--event-color", safeColor);
        element.style.setProperty("--event-border", `${hexToRgb(safeColor, 0.34)}`);
        element.style.setProperty("--event-bg", `${hexToRgb(safeColor, 0.12)}`);
      }

      function hexToRgb(hex, alpha) {
        const value = hex.replace("#", "");
        const red = parseInt(value.slice(0, 2), 16);
        const green = parseInt(value.slice(2, 4), 16);
        const blue = parseInt(value.slice(4, 6), 16);
        return `rgba(${red}, ${green}, ${blue}, ${alpha})`;
      }

      function escapeHtml(value) {
        return value.replace(/[&<>"']/g, (char) => {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;",
          }[char];
        });
      }

      populateTimeOptions();
      resetFormDate();
      applyReminderRepeat(els.reminderRepeatInput.value);
      render();
      loadEventsFromDesktop();
      setInterval(checkReminders, 15000);
      checkReminders();
    </script>
  </body>
</html>
